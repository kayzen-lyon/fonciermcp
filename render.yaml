services:
  - type: web
    name: lex-foncier
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FREE_LIMIT
        value: "3"
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /health
